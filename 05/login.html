<!DOCTYPE html>
<html lang="ko">
  <head>
		<meta charset="UTF-8">
		<title>로그인</title>
  </head>
  <body>
	<form>
    <fieldset>
      <!-- Do it! 텍스트 필드와 비밀번호 필드가 있는 로그인 폼 만들기 -->
       <legend>labe 안에 input, 한 줄로 연결</legend>
      <label>아이디 : <input type="text"></label>
      <label>비밀번호 : <input type="password"></label>
      <input type="submit" value="로그인">
    </fieldset>
    <fieldset>
      <legend>for와 id로 연결</legend>
      <label for="user-id">아이디 : </label>
      <input type="text" id="user-id">
      <label for="user-pw">비밀번호 : </label>
      <input type="password" id="user-pw">
      <input type="submit" value="로그인">
    </fieldset>
  </form>
  </body>
</html>
